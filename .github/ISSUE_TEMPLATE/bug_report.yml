name: Bug report
description: Something in Boomtown doesn't work as it should.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Boomtown better! Please search existing issues first, one bug per report.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new city on River Valley
        2. Build a coal plant next to a road
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iPhone, iPad, Mac, Android phone, Android tablet]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 16 Pro, iOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Boomtown version
      description: Shown in the App Store / Google Play listing.
      placeholder: "1.0"
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options: [Every time, Sometimes, Only once]
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
      description: Drag images or videos here. A screenshot of the city where it happens helps a lot.
